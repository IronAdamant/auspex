# Mirror of [mcp_servers.auspex] in ~/.grok/config.toml.
# Keep the live key in gitignored examples/auspex-ts/.env — Auspex loads it.
# Restart Grok after changing MCP config.
# This is a remote Solari Chrome for the agent — not Browser Use, not a window on the Mac.

# Use an absolute node binary. Grok's MCP spawn PATH often lacks `node`,
# so the tsx shebang (`#!/usr/bin/env node`) dies with "node: No such file or directory".
[mcp_servers.auspex]
command = "/absolute/path/to/node"
args = ["/absolute/path/to/auspex/examples/auspex-ts/dist/mcp.mjs"]
cwd = "/absolute/path/to/auspex/examples/auspex-ts"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180
