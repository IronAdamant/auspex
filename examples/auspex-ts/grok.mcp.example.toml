# Copy into ~/.grok/config.toml. Do not commit a live slr_live_ key.
# Restart Grok after adding this so auspex_check / auspex_login / auspex_profiles appear.
#
# Do not add npx @solarisdk/mcp (Solari's 27-tool CDP server) by default.
# That keeps sessions open and exposes sandbox/desktop. Auspex is the closed-loop tool.

[mcp_servers.auspex]
command = "npx"
args = ["tsx", "src/mcp.ts"]
cwd = "/Users/aron/Documents/coding_projects/auspex/examples/auspex-ts"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180
# Set SOLARI_API_KEY in the environment that launches Grok, or locally:
# env = { SOLARI_API_KEY = "slr_live_…" }
