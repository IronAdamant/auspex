name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Human step: Settings → Pages → Source = GitHub Actions.
# Do not set the GitHub homepage until this URL 200s and the replay plays.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/auspex-ts/package-lock.json
      - name: Generate replay player from ndjson
        working-directory: examples/auspex-ts
        run: |
          npm ci
          npm run generate:replay
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/demo
          cp -a docs/. _site/
          cp examples/auspex-ts/demo/replay.html \
            examples/auspex-ts/demo/ironadamant.png \
            examples/auspex-ts/demo/receipt.json \
            examples/auspex-ts/demo/ironadamant-receipt.json \
            examples/auspex-ts/demo/consistencyhub.png \
            examples/auspex-ts/demo/consistencyhub-receipt.json \
            examples/auspex-ts/demo/onedrive-receipt.json \
            examples/auspex-ts/demo/host-changed-receipt.json \
            examples/auspex-ts/demo/dogfood-pack.json \
            _site/demo/
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
