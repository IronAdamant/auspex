name: auspex-ts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      spec:
        description: "npm spec for the published-package smoke (e.g. auspex-solari@0.1.9)"
        required: false
        default: "auspex-solari@latest"
  schedule:
    - cron: "17 6 * * *"
    - cron: "42 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/auspex-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/auspex-ts/package-lock.json
      - run: npm ci
      - run: npm run build:mcp
      - run: npm test
      - run: npx tsc --noEmit
      - name: npm audit high+
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Root spawn door
        working-directory: ${{ github.workspace }}
        run: node bin/auspex.mjs --help
      - name: Packed-tarball MCP smoke (what npm users install; no key)
        working-directory: ${{ github.workspace }}
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          node examples/auspex-ts/scripts/release-smoke.mjs --spec "$(ls "$RUNNER_TEMP"/auspex-solari-*.tgz)"

  live:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/auspex-ts
    env:
      SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
      AUSPEX_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/auspex-ts/package-lock.json
      - run: npm ci
      - name: Live Solari smoke
        run: |
          if [ -z "$SOLARI_API_KEY" ]; then
            echo "Skipping live smoke: SOLARI_API_KEY secret is not set"
            exit 0
          fi
          npx tsx src/cli.ts check https://example.com --expect "Example Domain"
      - name: Published-package MCP smoke (npm release, live verify)
        env:
          SMOKE_SPEC: ${{ github.event.inputs.spec || 'auspex-solari@latest' }}
        run: |
          if [ -z "$SOLARI_API_KEY" ]; then
            echo "Skipping published smoke: SOLARI_API_KEY secret is not set"
            exit 0
          fi
          node scripts/release-smoke.mjs --live --spec "$SMOKE_SPEC"

  public:
    # Repo secret SOLARI_API_KEY is present; weekly public runs live
    # (observed Actions 35605123361, 2026-09-21). If it were unset the step
    # skips (exit 0) so pull requests are not blocked. Do not remove it.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '42 6 * * 1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/auspex-ts
    env:
      SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/auspex-ts/package-lock.json
      - run: npm ci
      - name: Weekly public Checkpoint / ironadamant check
        run: |
          if [ -z "$SOLARI_API_KEY" ]; then
            echo "Skipping public check: SOLARI_API_KEY secret is not set"
            exit 0
          fi
          npx tsx scripts/public-check.ts
