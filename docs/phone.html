<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Auspex phone login</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; color: #e8eef4; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header { padding: 10px 12px 8px; font-size: 14px; }
    header strong { display: block; font-size: 16px; }
    #status { color: #9ab; font-size: 13px; margin-top: 4px; }
    #stage { flex: 1; min-height: 120px; position: relative; background: #0b0f14; }
    #screen { position: absolute; inset: 0; }
    #boot {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #0b0f14; text-align: center; padding: 24px;
    }
    #boot.hidden { display: none; }
    .spin {
      width: 36px; height: 36px;
      border: 3px solid #243044; border-top-color: #e8eef4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #bootText { margin: 0; color: #9ab; font-size: 15px; }
    #bar { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); background: #121821; border-top: 1px solid #243044; }
    #ime, #paste {
      width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px;
      border-radius: 8px; border: 1px solid #3a4a60; background: #0b0f14; color: #e8eef4;
    }
    #paste { display: none; margin-top: 8px; min-height: 4.5em; font-size: 14px; }
    #paste.show { display: block; }
    #copied {
      display: none; margin-top: 8px; padding: 12px; border-radius: 8px;
      background: #1f6a3a; color: #e8eef4; font-weight: 600; text-align: center; font-size: 16px;
    }
    #copied.show { display: block; }
    #copyScratch {
      position: fixed; left: 0; top: 0; width: 1px; height: 1px;
      opacity: 0.01; border: 0; padding: 0; margin: 0;
    }
    #row { display: flex; gap: 8px; margin-top: 8px; }
    #row button {
      flex: 1; text-align: center; color: #0b0f14;
      background: #e8eef4; border: 0; border-radius: 8px; padding: 10px; font-size: 15px; font-weight: 600;
    }
    #row button.ghost { background: transparent; color: #e8eef4; border: 1px solid #3a4a60; }
    #save.copied { background: #1f6a3a; color: #e8eef4; border-color: #1f6a3a; }
    .err { color: #f88; }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <strong>Auspex phone login</strong>
      <div id="status">Tap the remote Chrome to click. Type in the field below so the phone keyboard opens. Keys go into the remote Chrome, not into chat.</div>
    </header>
    <div id="stage">
      <div id="boot" aria-live="polite">
        <div class="spin" aria-hidden="true"></div>
        <p id="bootText">Opening remote Chrome…</p>
      </div>
      <div id="screen"></div>
    </div>
    <div id="bar">
      <input id="ime" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Type here (phone keyboard)" />
      <textarea id="copyScratch" readonly tabindex="-1" aria-hidden="true"></textarea>
      <div id="copied">Copied. Paste it in your AI chat.</div>
      <textarea id="paste" readonly></textarea>
      <div id="row">
        <button type="button" id="backspace">Delete</button>
        <button type="button" id="enter">Enter</button>
        <button type="button" id="save" class="ghost">Save</button>
      </div>
    </div>
  </div>
  <script src="./novnc-rfb.js"></script>
  <script>
    (function () {
      var XK_BACKSPACE = 0xff08
      var XK_TAB = 0xff09
      var XK_RETURN = 0xff0d
      var params = new URLSearchParams(location.hash.replace(/^#/, ""))
      var token = params.get("v") || ""
      var profileName = params.get("n") || ""
      var status = document.getElementById("status")
      var boot = document.getElementById("boot")
      var bootText = document.getElementById("bootText")
      var ime = document.getElementById("ime")
      var paste = document.getElementById("paste")
      var scratch = document.getElementById("copyScratch")
      var copied = document.getElementById("copied")
      var screen = document.getElementById("screen")
      var save = document.getElementById("save")
      var rfb = null
      var last = ""
      var bootTimer = null

      function setStatus(text, err) {
        status.textContent = text
        status.className = err ? "err" : ""
      }

      function setBoot(text, hide) {
        bootText.textContent = text
        if (hide) boot.classList.add("hidden")
        else boot.classList.remove("hidden")
      }

      function savePasteLine(name) {
        if (name) {
          return "I tapped Save on the Auspex phone page for profile " + name + ". Run npx auspex await-login --profile " + name + " --save-editor (or auspex_await_login with saveEditor true). Do not open Solari on the phone (GET editor HTTP 401). --save-editor does not refresh folded sessionStorage; run finalize-login while the token is valid."
        }
        return "I tapped Save on the Auspex phone page. Run npx auspex await-login --save-editor (or auspex_await_login with saveEditor true). Do not open Solari on the phone (GET editor HTTP 401). --save-editor does not refresh folded sessionStorage; run finalize-login while the token is valid."
      }

      function copyOnTap(text) {
        scratch.value = text
        scratch.removeAttribute("readonly")
        scratch.focus()
        scratch.setSelectionRange(0, text.length)
        var ok = false
        try { ok = document.execCommand("copy") } catch (e) {}
        scratch.setAttribute("readonly", "readonly")
        scratch.blur()
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { ok = true }).catch(function () {})
        }
        return ok
      }

      function showCopied() {
        copied.classList.add("show")
        save.textContent = "Copied"
        save.classList.add("copied")
        setStatus("Copied. Paste it in your AI chat, then stay on this page.")
      }

      save.addEventListener("click", function () {
        var line = savePasteLine(profileName)
        paste.value = line
        copyOnTap(line)
        paste.classList.add("show")
        showCopied()
      })

      if (!token) {
        setBoot("This page needs a live link from auspex login. Remint and open the phone URL.", false)
        setStatus("This page needs a live link from auspex login. Remint and open the phone URL.", true)
        ime.disabled = true
        return
      }

      function sendKey(keysym, code) {
        if (!rfb || typeof rfb.sendKey !== "function") return
        rfb.sendKey(keysym, code)
      }

      function sendChar(ch) {
        var cp = ch.codePointAt(0)
        if (!cp) return
        var keysym = cp < 0x80 ? cp : (0x01000000 | cp)
        sendKey(keysym, "Unidentified")
      }

      function sendBackspace() {
        sendKey(XK_BACKSPACE, "Backspace")
      }

      function sendDiff(prev, next) {
        var i = 0
        var max = Math.min(prev.length, next.length)
        while (i < max && prev.charAt(i) === next.charAt(i)) i++
        for (var k = prev.length; k > i; k--) sendBackspace()
        for (var n = i; n < next.length; n++) sendChar(next.charAt(n))
      }

      ime.addEventListener("input", function () {
        var next = ime.value
        sendDiff(last, next)
        last = next
      })
      ime.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault()
          sendKey(XK_RETURN, "Enter")
        } else if (e.key === "Tab") {
          e.preventDefault()
          sendKey(XK_TAB, "Tab")
        } else if (e.key === "Backspace" && ime.value === "") {
          e.preventDefault()
          sendBackspace()
        }
      })
      document.getElementById("backspace").addEventListener("click", function () {
        if (ime.value) {
          ime.value = ime.value.slice(0, -1)
          sendDiff(last, ime.value)
          last = ime.value
        } else {
          sendBackspace()
        }
        ime.focus()
      })
      document.getElementById("enter").addEventListener("click", function () {
        sendKey(XK_RETURN, "Enter")
        ime.focus()
      })

      var RFB = (window.NoVNCRFB && window.NoVNCRFB.default) || window.NoVNCRFB
      if (typeof RFB !== "function") {
        setBoot("Phone viewer failed to load. Remint auspex login.", false)
        setStatus("Phone viewer failed to load. Remint auspex login.", true)
        return
      }

      function hideBootWhenReady() {
        var tries = 0
        if (bootTimer) clearInterval(bootTimer)
        bootTimer = setInterval(function () {
          tries++
          var canvas = screen.querySelector("canvas")
          if (canvas && canvas.width > 2 && canvas.height > 2) {
            clearInterval(bootTimer)
            bootTimer = null
            setBoot("Ready", true)
            setStatus("Connected. Tap the remote Chrome to click, then type in the field below.")
            ime.focus()
          } else if (tries === 16) {
            setBoot("Still opening remote Chrome…")
          } else if (tries > 60) {
            clearInterval(bootTimer)
            bootTimer = null
            setBoot("Ready", true)
            setStatus("Connected. If the window is still blank, wait a few seconds or remint.")
          }
        }, 500)
      }

      var ws = "wss://api.getsolari.com/vnc-proxy/ws?token=" + encodeURIComponent(token)
      try {
        rfb = new RFB(screen, ws)
        rfb.scaleViewport = true
        rfb.resizeSession = true
        rfb.background = "#0b0f14"
        rfb.addEventListener("connect", function () {
          setBoot("Opening Chromium…")
          hideBootWhenReady()
        })
        rfb.addEventListener("disconnect", function () {
          if (bootTimer) clearInterval(bootTimer)
          setBoot("Disconnected. Remint auspex login if this sat idle.", false)
          setStatus("Disconnected. Remint auspex login if this sat idle.", true)
        })
      } catch (err) {
        setBoot("Could not open the remote Chrome. Remint auspex login.", false)
        setStatus("Could not open the remote Chrome. Remint auspex login.", true)
      }
    })()
  </script>
</body>
</html>
